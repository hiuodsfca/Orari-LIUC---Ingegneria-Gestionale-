name: Aggiornamento Orario LIUC

on:
  # Trigger manuale per test immediati
  workflow_dispatch:

  # Esecuzione programmata (tutti i giorni alle 05:00 UTC = 06:00 CET)
  schedule:
    - cron: '0 5 * * *'

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout del repository (scarica i file)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }} # Usa il Secret PAT per il push
          ref: main # Assicurati di lavorare sul ramo principale

      # 2. Setup dell'ambiente Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Versione Python compatibile

      # 3. Installazione delle dipendenze (le tue librerie)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests icalendar pendulum

      # 4. Esecuzione dello script Python
      - name: Run Scraper and Generate ICS
        run: python full_scraper.py
        
      # 5. Caricamento dei cambiamenti su GitHub
      - name: Commit and Push new ICS file
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          # Controlla se ci sono differenze e, in caso, crea il commit
          git add orario_liuc_completo.ics
          
          # Se il commit fallisce perché non ci sono modifiche, ignoriamo l'errore
          git commit -m "Auto-update: Orario generato da GitHub Actions" || echo "Nessuna modifica da committare"
          
          # Forza il push usando il token nel secret
          git push
